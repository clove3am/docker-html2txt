# .github/workflows/docker-publish.yml
name: Build and Publish Docker Image to GHCR

# Controls when the action will run.
on:
  # Run on a schedule (e.g., every Saturday at 3 PM UTC) to get the latest Go updates.
  schedule:
    - cron: '0 15 * * 6'
  # Also run whenever you push changes to the main branch.
  push:
    branches: [ "main" ]
  # Allows you to run this workflow manually from the Actions tab.
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      # Required to read the repository contents.
      contents: read
      # Required to write packages (i.e., push Docker images).
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # This sets up an emulator that allows building for ARM on an AMD64 machine.
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    # This sets up Docker's more advanced builder, Buildx.
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to the GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        # The username is the owner of the repository (your GitHub username or organization).
        username: ${{ github.repository_owner }}
        # The GITHUB_TOKEN is automatically created by Actions and has permissions to push images.
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        # This points to the image repository on GHCR.
        images: ghcr.io/${{ github.repository_owner }}/html2txt

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        # Build for both amd64 (standard PCs, servers) and arm64 (Raspberry Pi, Apple Silicon, etc.).
        platforms: linux/amd64,linux/arm64
        push: true
        # Use the tags generated by the metadata step (e.g., :latest, :sha-xxxxxxx).
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
